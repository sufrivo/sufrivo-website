name: Website quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate localized routes
        run: python3 scripts/build_i18n.py
      - name: Validate generated locale routes and SEO safety
        run: python3 -m unittest discover -s tests -p 'test_i18n.py'
      - name: Validate JavaScript and route entrypoints
        run: node --test tests/site.test.cjs
