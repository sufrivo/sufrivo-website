name: Import Figma-generated photography
on:
  push:
    branches:
      - feat/photo-first-products-industries-about
    paths:
      - .github/workflows/import-figma-photography.yml
      - assets/figma-photo-manifest.json
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original Figma AI images
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, time
          data=json.loads(pathlib.Path('assets/figma-photo-manifest.json').read_text())
          for filename,url in data.items():
              dest=pathlib.Path(filename)
              dest.parent.mkdir(parents=True,exist_ok=True)
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 SufrivoImageImport/1.0'})
                      with urllib.request.urlopen(req,timeout=35) as response:
                          body=response.read()
                      if not body.startswith(bytes.fromhex('ffd8ff')) or len(body)<10000:
                          raise ValueError('Expected nonempty JPEG: '+filename)
                      dest.write_bytes(body)
                      print(filename,len(body))
                      break
                  except Exception:
                      if attempt==3: raise
                      time.sleep(2*(attempt+1))
          print('Imported',len(data),'Figma AI JPEG images')
          PY
      - name: Commit photos to pull-request branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/capabilities assets/images/industries assets/images/integrations assets/images/about
          git diff --cached --quiet || (git commit -m 'assets: import 47 original Figma-generated photographs' && git push)
